version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Central Intelligence Graph & Case Workspace Backend
  # ---------------------------------------------------------------------------
  central-intelligence:
    build:
      context: ./ml/central-intelligence
      dockerfile: Dockerfile
    container_name: siris-central-intel
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    restart: always

  # ---------------------------------------------------------------------------
  # 2. FIR / BNS Statutory RAG Intelligence Engine
  # ---------------------------------------------------------------------------
  fir-bns-rag:
    build:
      context: ./ml/fir-bns-rag
      dockerfile: Dockerfile
    container_name: siris-fir-bns-rag
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - PORT=8001
    restart: always

  # ---------------------------------------------------------------------------
  # 3. Gemini Live WebSocket Voice Gateway
  # ---------------------------------------------------------------------------
  voice-gateway:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: siris-voice-gateway
    ports:
      - "10000:10000"
    env_file:
      - .env
    environment:
      - PORT=10000
    restart: always

  # ---------------------------------------------------------------------------
  # 4. Frontend Web Application (React + Vite SPA)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
        VITE_INTEL_SERVICE_URL: http://localhost:8000/api/v1/graph
        VITE_RAG_API_URL: http://localhost:8001
    container_name: siris-frontend
    ports:
      - "80:80"
    depends_on:
      - central-intelligence
      - fir-bns-rag
      - voice-gateway
    restart: always

