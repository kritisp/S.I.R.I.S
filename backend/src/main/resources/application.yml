server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: crimelens-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Security & JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:4c8b9d3f5e1a7c2b8e4f0a9d3c5e7b1a9f0e2d4c6b8a0e2f4a6c8b0d2e4f6a8b}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    issuer: crimelens-state-command
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  ml:
    fir-bns-url: ${ML_GATEWAY_URL:http://localhost:8000}
    internal-api-key: ${INTERNAL_API_KEY:crimelens-internal-secret-key-2026}
    read-timeout-ms: 40000
